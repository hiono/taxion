version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    Copilot の残量をモデル起動なしで取得する `runtime quota` を追加します。保存済みの承認済み指示は `--dispatch ID`、外側の操作担当は既存読取り許可の下で `--account ACCOUNT --approve-account-read` を使えます。後者は Task、指示、作業台帳を作らず、ログイン済みアカウントを照合します。観測は実行許可ではなく、`executionAuthorized:false` を返します。
    `ready` と同梱管理スキルは、既存の観測を先に使い、全体残量・承認済み上限・次の作業単位・停止余裕から継続を判断するよう案内します。厳密なセッション別帰属を理由に同じ数値を利用者へ転記させません。Copilot と OpenCode の無料枠／Go、外側と実行担当の予算は区別し、`provider-stop` に数値残量を一律要求しません。
    OpenCode ACP の非同期処理は呼出し準備の終了後もセッションの寿命まで継続し、停止・完了・期限の境界を維持します。判断と制約は `ADR-0060`／`ADR-0063`、操作は課金ガイドと CLI リファレンスに記録しています。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.9` を明示選択します。安定版の自動更新先にはしません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    管理スキルは 1.3.15 です。更新を許可されている場合は旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。旧スキルを通知なく更新せず、開発機側でも配布版と同じ手順を使います。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    外側の残量読取りは既存の許可を必要とし、アカウント、単位、観測時刻を保持します。残量があっても承認済み上限を拡大しません。取得不能・鮮度切れ・利用拒否は非ゼロ終了し、自動再送や課金方式変更を行いません。指示単位の照会は停止済み作業を再開しません。
    OpenCode のアカウント残量取得は未対応です。無料枠／Go の実契約別受入れは Issue #234／#231 で継続し、対象外にはしません。`LiteLLM` や自動費用最適化の仕組みは導入しません。製品環境での適用確認は未実施であり、配布自体は製品の品質合格を意味しません。
    検証コマンドは承認済みの権限で任意のコードを実行できます。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
