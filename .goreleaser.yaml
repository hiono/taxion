version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    入力検証に合格した最初のレビュー指示について、作業場所の準備後、認証などでモデル開始前に停止した場合も `workflow reconcile-stopped` で整合回復できるようにします。
    コントローラは元候補との共通リポジトリ、正確な場所の登録、切り離された基点コミット、変更のないインデックス、対象ファイル、保持したスナップショットを照合します。追加ファイルや Git が無視するファイル、内容・登録の不一致は拒否します。既存の作業場所は削除・書換えせず、事前確認の `preservedReviewWorktree` と取消監査に保持します。
    元候補と合格済み入力検証記録を正式な後続契約へ引き継ぎ、新しい場所でレビューします。実装担当の起動と入力検証の再実行を追加せず、レビュー結果の受理検証は維持します。操作と制約は CLI リファレンスと `ADR-0058` に記録しています。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.10` を明示選択します。安定版の自動更新先にはしません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。全実行の停止を確認し、旧設定とデータベースを保全したうえで、新しい配布物の固定値を再承認し、旧設定の退避・再登録・`provenance verify` を行います。管理スキルは 1.3.16 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    対象は応答・実行開始・セッション・結果・利用量・実行記録がない、停止した最初の検証済み成果物レビュー指示です。実行停止の確認証拠、配送不明の受容、現在の事前確認ハッシュの承認は必要です。`session-starting` はモデル開始の証明ではなく、未配送や無課金も証明しません。既存の場所を手で修復して条件を通過させないでください。
    期限切れの工程は再開せず、期限・予算を延長しません。新しい契約・工程計画とモデル実行には有効な承認が必要です。製品環境での適用確認は未実施であり、配布自体は製品の品質合格を意味しません。OpenCode の無料枠／Go の実契約別受入れは Issue #234／#231 で継続します。
    検証コマンドは承認済みの権限で任意のコードを実行できます。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
