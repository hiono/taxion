version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    `artifactSource` による入力検証が失敗し、モデル指示のないまま停止した `Flow` から、通常の修正用後続へ進む契約を補強しました。`conversation intake` は旧入力と失敗証跡のハッシュを提案へ固定し、`conversation confirm` は停止・引継ぎ保留・実行所有権の解放と、元と後続の作業場所の入力同一性を確認します。同じ作業場所や、そのシンボリックリンク別名は拒否します。
    この経路では `supersedes`・`createdFrom`・`replacesFlow` に直近の失敗した入力の作業を指定し、`target` はキーごと省略します。架空のモデル指示や成功結果は作りません。旧失敗証跡と終端履歴を維持します。`ready`・`help`・管理スキルに、提案、確認、工程計画と承認の順序を明記しました。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.6` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、同じ明示保存先と旧状態を保護してから固定値を更新してください。
    管理スキルは 1.3.10 です。更新を許可されている場合は、旧ファイルを保全して `ready --update-skill`、`ready --check-skill`、`ready` を実行します。`RC5` の未確認提案は書き換えず、未使用の新しい作業 ID で再提案し、実際の新提案ハッシュを承認します。この証跡固定は文書だけの更新では利用できません。
    修正用後続は通常の実装担当と独立レビュー担当を持つ別契約です。元の目的・受入れ条件・検証を維持し、必要な追加範囲・設定・実行枠だけを判断します。`maxRepairs: 0`、実装担当1回・レビュー担当1回の例と、`--controller-validation-submission` による役割分担は復旧手順に記載しています。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい入力・検証記録を保存したデータベースを旧版で更新しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    この後続契約は、入力検証 `FAILED`、`STOPPED / SAFETY_STOP`、引継ぎ保留、実行所有権解放済み、モデル指示ゼロの場合に限ります。結果不明の `RUNNING` や入力変更は拒否します。外部プロセスの停止は別途確認してください。失敗検証を同じ終端の作業で再送する機能ではありません。
    修正担当なしの入力入口自体は引き続き `snapshot`・修正なし・独立レビュー1回に限定します。自動修正ループ、任意の役割連携委譲、保全用出力から復元した作業領域の直接実行は未対応です。この経路の製品運用確認は未実施であり、配布自体は製品の品質合格を意味しません。
    検証コマンドは承認済みの権限で任意のコードを実行できます。`file tools` の許可はその実行承認の代わりになりません。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
