version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    実行中の保存で短時間の SQLite ロック競合が起きると、待機せず停止していた問題を修正しました。各接続に5秒の待機を設定し、更新は読取り前に書込み権を予約します。別接続による短い照会や更新との競合を扱います。
    作業状態の読取りを一つの読取り専用トランザクションにまとめ、`Ledger`・`Graph`・保存記録を異なる確定時点から組み合わせないようにしました。
    
    ## Compatibility
    
    保存形式、承認、期限、予算、残量下限は変更しません。待機は承認や期限を延長しません。モデル送信、ツール実行、更新処理の再実行は行いません。
    待機後も保存できない場合はエラーを返し、実行処理は従来どおり安全停止と引継ぎ保留の対象になります。停止済みの履歴を書き換えたり、成功扱いにしたりしません。
    
    ## Upgrade
    
    mise の GitHub 対応機能で `v0.7.18` に固定し、配布情報、ファイルのハッシュ、公開処理全体の成功を照合してください。
    保存状態と設定を保護し、稼働中の処理を停止・照合してから、新しい配布情報と実行ファイルのパスを再承認します。既存の運用設定を自動更新したり、承認済み上限を削除したりしません。
    
    ## Rollback
    
    戻し先は配布情報で検証する `v0.7.17` です。実行ファイルを戻しても保存状態、承認、期限、予算は巻き戻しません。旧版では短時間のロック競合による停止が再発し得ます。
    
    ## Known limitations
    
    5秒を超えるロックや同時の保存形式移行は保証しません。表示コマンドの一部は初期化・移行経路を使うため、無書込みとは限りません。SQLite の記録方式は変更せず、`WAL` への自動移行は行いません。
    停止済みの処理は自動で再開しません。元の成果・検証・停止証跡を保持し、正式な継続手順と必要な承認を使ってください。実作業の再開成功は、この公開だけでは実証していません。
    残量監視は厳密な請求上限の保証ではありません。不明な使用量を無料・計測完了とは扱いません。
    残量照会の認証タイムアウトと、停止通信が完了しない問題は今回の保存競合修正の対象外です。取消要求が残った場合は、保存した実行単位の停止を正式に確認するまで新しい実行を始めないでください。
changelog:
  disable: true
