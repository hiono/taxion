version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    通常の `Flow` で、元の差分基点と出力コミットが異なる受理済み `Coder` 出力を `Reviewer` へ引き継ぐ際、完全なツリーと全変更パスを同じ差分基点で照合するよう修正します。今回編集したパスだけへ範囲を縮めません。
    準備時に停止した未開始 `Reviewer` は、静止確認と配信・利用量の不確実性への明示承認後に取り消せます。同じ受理済み出力からレビューのみの後続を作り、`Coder` や受理済み検証を再実行しません。旧 `Flow`、成功結果、検証記録、累計消費と停止履歴を保持します。
    期限切れの旧 `Flow` は復活させず、承認した将来の固定期限で後続を作ります。実行中・対象変更・承認不足は引き続き拒否します。
    `workflow terminate`、`reconcile-stopped`、`recover-review` のヘルプと管理スキルに、適用条件、完全なJSON例、承認境界と期待状態を記載します。持込み成果物専用の復旧が拒否された場合は、確認済みの失敗条件と未評価の条件を区別します。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.23` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.23 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.22` です。この修正は含まれません。新しい指示・取消・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    今回の通常 `Flow` 復旧は合成Gitリポジトリと保存状態で検証しています。運用機の原本取得・本番台帳操作・実モデルでの再開は行っておらず、運用上の受入れ完了は主張しません。実行済み `Reviewer` や準備状態が不明な作業場所を、未開始として取り消すことはできません。OpenCode ACP、保存課金契約、認証付きMCPの実サービス受入れも引き続き未完了です。詳しい検証範囲は通常レビュー復旧の検証記録とIssue #229、#231、#234を参照してください。
changelog:
  disable: true
