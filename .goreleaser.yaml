version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added
    
    利用者が作成したプログラムや保存済みの未検証入力を、実装担当の成功結果なしで検証と独立レビューへ進められます。`workflow plan|start` の `artifactSource` で `snapshot` 入力を固定し、実際の検証結果と入力の来歴を分けて保存します。実装担当の起動数と許可上限はゼロです。
    `workflow validate-input --id FLOW_ID` は承認済みの検証コマンドを実行し、入力が変わらず検証が成功した場合だけレビュー担当への指示を発行します。このコマンドではモデルを起動せず、`doctor --dispatch` で診断してから `workflow run --id FLOW_ID --builtin-prompts` で独立レビューを開始できます。空差分でも、承認対象のプログラム全体のレビューを省略しません。
    
    ## Fixed
    
    持込み変更パスを実装担当に申告させる必要がなくなります。入力を新しい実装成果や品質合格へ置き換えず、旧結果・旧セッション・終端の `Flow` は保持します。通常後続の確認でも、終端の `Flow` の停止理由を書き換えません。モデル指示をまだ発行していない段階でも、持込み `snapshot` を保全用の出力へ含めます。
    `ready`・`help`・管理スキルに、保存済み課金条件の確認と操作入口を明記しました。`provider-stop` だけを理由に数値残量の照会や手入力を必須にせず、明示された利用上限と独立した残量確認条件は維持します。入力項目の確認に Taxion の実装ソースを取得する必要はありません。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.5` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、元の明示保存先と状態を保護してから新しい配布物のパスと固定値を適用してください。
    管理スキルは 1.3.9 です。更新を許可されている場合は、旧ファイルを保全して `ready --update-skill` を実行し、`ready --check-skill` と `ready` を確認します。新しい入口には `READY` の契約・設定と、対象入力を含む工程計画の明示承認が必要です。既存承認が同じ対象とレビュー担当の設定を正式に含む場合、ApprovalBundle の形式だけを理由に承認を重ねません。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい入力・検証記録を保存したデータベースを旧版で更新しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    新しい入口は `snapshot`・修正なし・独立レビュー1回に限定します。修正ループ、任意の役割連携委譲、保全用出力から復元した作業領域の直接実行は未対応です。検証コマンドの失敗や実行開始後の結果不明は自動再実行せず、証跡を保全して停止します。実際の製品作業での運用確認はこれから行うもので、この配布自体は製品の品質合格を意味しません。
    検証コマンドは承認済みの権限で任意のコードを実行できます。`file tools` の許可はその実行承認の代わりになりません。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
