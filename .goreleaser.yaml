version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    継続判断を操作の副作用ごとに分けました。同じ承認・対象・期限・予算内の未開始の実装担当、レビュー担当、修正・再レビューでは、任意の引継ぎ記録機能や手順の違いだけを理由に再承認を要求しません。準備だけの失敗とモデル実行後の不明状態を区別し、不明な送信を再実行することはありません。
    新しい工程計画の第2版は時間・利用量の見積もりを配分の参考とし、未見積もりや予測超過だけでは止めません。実期限、承認済みの実上限、上限照合に必要な利用量の不明、回数と品質の条件は維持します。既存の第1版の計画・承認を書き換えません。
    指示の第6版は、提供された依頼原文・承認・設計理由・未解決事項・選択済み仕様・前工程の正確な結果を、出典・版・ハッシュ付きで参照できます。Copilot は専用読取り機能、`OpenACP` は読取り専用の可逆な `JSONL` 資料を使います。要約は索引であり、レビュー担当は原文と固定成果物を独立に照合します。
    `request` は人の依頼・追記と表示用の計画担当の出力を非公開の追記専用記録に残し、実行提案のハッシュに固定します。資格情報の既知パターンは秘匿化し、元入力のダイジェストと秘匿化を明示します。最小の再開用記録に会話全文を詰めず、内部推論や基盤セッションの逐語記録は保存しません。課金枠の残量観測は実行用の資料・ファイル・ツール準備を必要とせず、モデルを起動できない専用接続を使います。
    `workflow record-failed-review` は回答完了と正常終了を別の証拠として扱い、無関係な実行の停止を指摘追記の前提にしません。元の失敗・利用量・承認は保持し、指摘の保存を品質合格や修正実行の許可にはしません。対象・権限・設定・送信不明・公開内容の保護は維持します。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.8.0` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.27 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。旧 Task・結果・停止履歴は保持し、保存済みの承認と証拠から次の未完了処理を選びます。設計・移行と制約は `ADR-0073` と CLI リファレンスを参照してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.24` です。新しい工程計画の第2版、指示の第6版、原文記録や新しい指摘記録を含むデータベースを、理解しない旧版で更新しないでください。現状を保護し、更新前の整合バックアップを別配置で使います。成果・停止履歴・指摘・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    全状態・全操作の形式保証や、実モデルによる原文理解の品質保証ではありません。原文参照は実際に提供・保存した資料に限り、外側の会話の自動収集、未提供資料の復元、管理台帳や内部推論へのアクセスは行いません。未知の秘密を完全に検出する保証はないため、非公開の資料を公開しないでください。
    合成の実行基盤、実 Git、ローカル SDK 通信と `OS` 隔離の検査を、実モデル・実サービスの運用受入れと区別します。旧実行の適格性や製品受入れを確認したとは主張しません。成果物入力の任意の引継ぎ記録機能、復元先での成果物実行、OpenCode ACP・保存課金契約・認証付き MCP の実サービス受入れには未対応・未確認の範囲が残ります。
    
    ## Refs
    
    全面改定: https://github.com/hiono/taxion/issues/274 。正式配布と移行: https://github.com/hiono/taxion/issues/275 。元の時刻判定: https://github.com/hiono/taxion/issues/272 、https://github.com/hiono/taxion/pull/273 。
    マイルストーン: https://github.com/hiono/taxion/milestone/38 。正式配布Issueは全面改定Issueに、元の調査Issueは正式配布Issueに依存します。
changelog:
  disable: true
