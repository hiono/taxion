version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added
    
    工程制御の試験版に、実行前の承認確認と組み込み MCP の分離を追加しました。`workflow plan --file JSON` は計画ハッシュと、その時点の `contractGate` を返します。計画の承認と、保存した承認束・役割間委譲・実行時検査を区別できます。
    
    ## Fixed
    
    Copilot 子プロセスへ `--disable-builtin-mcps` を渡します。利用者設定の一時変更やモデル通信の無効化は不要です。`doctor` は `builtinMcpsDisabled` で実行時方針を示します。分離方針をセッションハッシュへ含め、従来の接続へ黙って適用しません。
    GitLab の読取り API 失敗は、照会段階と、CLI が起動して終了した場合の終了コード、または起動不能・取消などの理由を秘密なしで示します。外部更新の配送不確実性とは区別し、更新要求の検査は維持します。
    `ready` と管理スキルに、保存先の固定、承認束・役割間委譲の保存手順、事前確認だけの許可を実行へ流用しない条件を追記しました。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.2` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、元の明示保存先と状態を保護してから新しい配布物のパスと固定値を承認してください。
    管理スキルは 1.3.4 です。`ready --check-skill` が不一致を返したら、旧ファイルを保全し、明示許可を得て `ready --update-skill` を実行します。その後、互換性確認と `ready` を行います。旧セッションへ新しいハッシュで接続せず、停止履歴や承認は書き換えません。要求・Task・設定が変われば新しい計画ハッシュを承認してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。工程計画や工程監査を保存したデータベースを旧版で更新しないでください。現状を保護し、試験前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    組み込み MCP の無効化は、他の MCP、フック、プラグイン、シェル通信も禁止する隔離機能ではありません。GitLab の一時失敗の原因は未確定です。診断の変更は自動再送や未配信の証明ではありません。
    工程計画の見積もりは完了保証や提供元のクレジット予約ではなく、セッション上限は厳密な請求上限を保証しません。計画なしの旧 `Flow` と `request` に工程予約はなく、提供元停止方式へ残量照会は追加しません。実モデルでの完了率・費用改善は未確認です。導入と有料実行の承認は分けます。
changelog:
  disable: true
