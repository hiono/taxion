version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    通常の回答受信中に、期限監視と進捗確認が過去の台帳全体を繰り返し展開・検証する負荷を修正します。検証済みの観測用状態は、同じデータベース取引の変更番号が変わらない間だけ再利用します。別プロセスの承認・停止・期限変更と利用量保存は、変更後の再検証を経て反映します。
    稼働状態の確認は、正式な遷移と同じ契約・期限・利用量・資料の整合条件を読み取り専用で評価します。変化のない確認のために台帳全体を再保存しません。停止や結果受理などの遷移では、従来の取引内検証を維持します。回答の断片、正式記録、順序・重複照合、利用履歴を削減する修正ではありません。
    モデルを呼ばない合成履歴の比較計測と、小さい回答断片を受信する回帰試験を追加します。計測条件と結果は `docs/develop/event-observation-validation.md` に記載します。別マシンで発生した遅延の正確な時間や関数別内訳を、この開発環境で観測したとは主張しません。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.21-rc.14` を明示選択します。稼働中の実行ファイルは差し替えず、安定版の自動更新先にも変更しません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.19 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    この修正は過去の停止結果を書き換えず、期限・費用の延長も承認しません。完成済みの実装回答を再送せず、すでに発行した成果物レビューの担当から継続します。期限切れの場合は保存した候補・合格入力検証・累計消費を保持し、当該版の正式な停止後復旧と期限再契約に従います。保存回答の `finalizeSavedResult` はレビュー担当専用です。
    初回の状態取得と変更後の正式保存は履歴量に応じた処理を行います。提供元通信や別マシンでの適用時間を保証するものではありません。製品環境への導入・復旧成功は配布検証と別の受入れです。
changelog:
  disable: true
