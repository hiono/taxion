version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    `Planner`・直接質問の実行で、送信前の試行、作成したセッション、入力ハッシュ、終了した `main turn` の回答と利用量を追記保存します。利用枠の再確認や終了処理が失敗しても保存した観測を失わず、終了処理の成功だけで回答の受理を完了扱いにしません。
    `request recover` に、保存したCopilot回答を再送せず照合する `preview` と、承認したハッシュによる `apply` を追加しました。元のTask・出典・入力・履歴・期限・利用量を照合し、回答・`checkpoint`・照合判断を同じトランザクションで保存します。質問は未回答、提案は未承認のままです。
    v0.8.2の `version-2 request` には、元セッション、保存入力のハッシュ、元の `human` 本文、計画生成コンテキストのTask IDと停止証拠を指定する `--associate-legacy` を追加しました。過去の `receipt` を捏造せず、現在の明示的な照合判断として保存します。
    `--resolution cancel` は照合した停止 `operation` だけを終了します。通常の終了記録・利用量・回答の受理が不確実な場合は、`--confirm-stopped --accept-uncertainty` による取消に限定します。既知利用量を減らさず、未知利用量をゼロ扱いせず、元期限を延長しません。実際の排他リースを保持する所有者や履歴の変更は拒否し、解除後の作業にも通常の承認ゲートを要求します。
    共通の質問・検索処理は、主入力・メッセージ・回答のIDに対応した `assistant.turn_end` を扱い、キュー内の後続ツール・子エージェント・エラーを拒否します。実行提案内の資格情報と判定される値を拒否し、助言の秘匿処理と出典の秘匿履歴を保持します。未開始 `Dispatch` の行政取消では、`Graph` と `Ledger` の投影を同じトランザクションで更新します。
    
    ## Upgrade
    
    正式公開と公開後の全配布検証の完了を確認してから、実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.8.3` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧版と未コミット成果を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    旧 `operation-policy.json` は自動上書きせず、承認した配布物の固定値へ正式に更新して `provenance verify` を行います。対応管理スキルは1.3.28です。スキルの更新も明示承認の対象とし、`ready --check-skill` と `ready` で整合を確認します。`request recover --help`、CLIリファレンス、復旧ガイドと `ADR-0074` で適用条件を確認してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.8.2` です。現状を保護し、更新前の整合バックアップを別配置で使います。新しい `receipt` や停止履歴、利用量、承認を削除して戻す操作は行いません。旧版にはこの保存 `Planner` 回答の公開照合・解放操作がないため、再送や別の `store` への切替で迂回しないでください。
    
    ## Known limitations
    
    `version-1 checkpoint`、対応記録のない旧直接質問、非Copilot提供者の保存履歴照合は対象外です。通常の終了記録がない停止済み回答や不正な回答は、停止・不確実性承認を伴う取消の証拠としてのみ扱い、継続用に受理しません。
    元の運用事象で最初の `receipt` 受理が停滞した個別原因と、元の保存メタデータの適合は未確認です。合成復旧・公開入口の回帰とSDK読取りの検証を、元の運用保存領域・セッションの復旧成功と区別します。元実行の再送、製品実行、予算や期限の自動延長は行いません。
    
    ## Refs
    
    設計・利用条件と検証範囲: `ADR-0074`、CLIリファレンス、復旧ガイド、Planner復旧の検証記録。
    申し送り: Issue #282。
changelog:
  disable: true
