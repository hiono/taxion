version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    停止時に生成する引継ぎ保留の理由から前後の空白を除き、元の停止理由を失わないようにしました。保留の保存が失敗した場合も、最初の理由をエラーに含めます。利用者から受け取る入力の検証は緩和しません。
    利用者向けの説明から、対象者を不自然に区別する表記を修正しました。保存形式や既存の識別子は変更しません。
    
    ## Added
    
    `workflow accept-saved-review --file JSON --preview` で、引継ぎ保留の理由消失によって停止したレビュー専用のツリースナップショット形式を確認できます。期限前に保存された独立レビューの `APPROVE` と契約・承認・証拠・現在の成果を照合し、同じ確認結果の `expectedHash` を指定して受理します。
    新しいモデルや `Dispatch`、検証コマンドを起動せず、同じ `Flow` と実装 Task を完了します。レビュー用 Task の `BLOCKED` と成功結果の履歴、既存の `HOLD`、元の停止状態を保持します。期限後の受理には `allowExpired:true` の明示承認が必要で、実行期限や予算は延長しません。
    
    ## Upgrade
    
    mise で `v0.7.20` に固定し、配布情報・ファイルのハッシュ・公開処理全体の成功を照合してください。状態と設定を保護してから、新しい配布情報と実行ファイルのパスを再承認し、`taxion ready` を確認します。
    停止した作業は自動再開しません。受理する場合は CLI リファレンスの手順で事前確認し、対象と検査結果を確認してから明示的に適用してください。その間、元の実装用・現在の Task 用・解放済みのレビュー用の作業場所を変更しないでください。
    
    ## Rollback
    
    戻し先は配布情報で検証する `v0.7.19` です。新しい受理記録を作ったデータベースを旧版で更新しないでください。現状を保護し、受理前の整合したバックアップを別配置で使います。停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    受理操作は既知の理由消失で停止したレビュー専用のツリースナップショット形式に限定します。別の停止理由、期限後に保存された成功結果、契約や証拠の不一致、実行中の処理、未解決の介入は拒否します。
    元の実装用の作業場所は `detached HEAD` でも成果の一致を確認しますが、現在 Task の承認済みブランチとインデックスは必要です。失われた最初の停止理由は復元せず、推定を確定値として記録しません。受理は公開承認ではありません。
changelog:
  disable: true
