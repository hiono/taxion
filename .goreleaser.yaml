version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    成果の観測、旧契約への適合、新契約への受入れ、実行許可を分離します。`workflow observe-input` は明示した範囲の現在の Git 入力を記録し、`workflow assess-input` は受入れ可否、阻害理由、証拠、解消方法、承認差分、次の操作を構造化して返します。判定用の有料モデルは追加しません。
    後続契約は同じ `observationHash` に束縛し、保存済みの具体的な失敗・検証出力・未確認事項を担当への指示に含めます。前工程の記録がない通常入力は維持し、不正な記録を「なし」には変更しません。旧結果、停止履歴、未確定の利用量を新しい観測で上書きしません。
    検証専用の後続処理は実装成功を前提にせず、正式な入力検証と独立レビューへ進めます。実装成功・品質合格・公開許可はそれぞれ別のままです。詳細は `ADR-0066`、操作リファレンス、復旧ガイドに記載します。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.21-rc.15` を明示選択します。稼働中の実行ファイルは差し替えず、安定版の自動更新先にも変更しません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.21 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    この版は Git 入力に対する最初の共通実装です。任意形式・全役割の自動解釈、過去の作者・停止時点の同一性・未記録の検証や利用量の推定は行いません。観測には明示した範囲、対象、停止と結果受理の証拠が必要で、不足時は正式な拒否理由を残します。
    新しい観測記録を保存した作業領域は対応版で扱い、旧版で更新しないでください。新しい観測や入力の受入れだけでモデル実行、期限・費用の延長、公開を許可しません。外部利用環境で元の依頼が受入れ条件へ到達したことは未確認であり、配布検証とは別のゲートです。
changelog:
  disable: true
