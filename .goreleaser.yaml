version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    `workflow record-failed-review` の観測期限を、共用の固定5秒から専用の `--observation-timeout` に分けました。既定30秒、正の値で最大5分とし、元の提出期限や先に切れる呼出し元の期限は延長しません。
    通常の失敗も、失敗工程、観測期限、経過時間、保存結果を秘密情報を含めない JSON で返します。保存前・rollback確認済みは `NOT_WRITTEN`、commit確認済みは `COMMITTED`、確定できない場合は `UNKNOWN` です。cleanupの追加失敗で元の失敗工程を上書きしません。
    未保存が確認でき、対象・履歴・指摘・判断と承認hashが変わっていない場合の再適用は、元の追記承認の範囲で扱います。自動再送はせず、既存追記、証拠変更、保存不明を区別します。元の FAILED、Flow、利用量、提出時刻は変更しません。
    Dispatch結果の通常schemaも、`nextTransition` を実際の TaskStatus に限定します。不一致の検証エラーはフィールド名を示し、任意の提出値を転載しません。`workflow observe-input` の `scope` がパス文字列のJSON配列であることと、パスの解釈をhelpへ明記しました。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.8.1` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧版と未コミット成果を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    旧 `operation-policy.json` は自動上書きせず、承認した配布物の固定値へ正式に更新して `provenance verify` を行います。対応管理スキルは 1.3.27 です。`ready --check-skill` と `ready` で整合を確認します。追記の再適用条件は CLI リファレンスと復旧ガイド、設計は `ADR-0072` と `ADR-0073` を参照してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.8.0` です。現状を保護し、更新前の整合バックアップを別配置で使います。成果・停止履歴・指摘・承認を削除して戻す操作は行いません。旧版には固定5秒と診断不足の問題が残るため、追記の再適用を復旧手段として繰り返さないでください。
    
    ## Known limitations
    
    観測期限はコマンド全体の厳密な時間上限ではありません。設定、ファイル・DB準備、operation lease、mutex待機、cleanupや出力は期限を越える場合があります。保存不明時は公開記録を照合し、承認hashの一致だけで再適用しないでください。
    元の運用事象のタイムアウト工程は未特定です。隔離した合成store、ローカルSDK通信と実CLIの検証を、運用store・元session・製品受入れの確認とは区別します。指摘追記は品質合格、モデル再送、Flow再開、修正実行を許可しません。
    
    ## Refs
    
    修正: https://github.com/hiono/taxion/issues/277 、https://github.com/hiono/taxion/issues/278 。
    正式配布: https://github.com/hiono/taxion/issues/279 。配布Issueは両方の修正Issueに依存します。
    マイルストーン: https://github.com/hiono/taxion/milestone/39 。
changelog:
  disable: true
