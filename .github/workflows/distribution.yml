name: binary-distribution
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
      - run: |
          echo "TAXION_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          python3 scripts/release.py prepare --tag "v$(cat VERSION)" --snapshot
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
  native-smoke:
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: binary-archives
          path: dist
      - run: python scripts/release.py smoke
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.0
          install: false
      - run: python scripts/mise_smoke.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
