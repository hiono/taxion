version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    `workflow record-failed-review` で、回答・ターン終了が正式な失敗記録以前に保存され、正常終了記録だけがその後に残った場合を扱えます。`v0.7.24` は接続終了まで失敗記録以前とする条件で拒否していました。回答完了と接続終了を別の証拠として照合します。
    回答・ターン終了は保存済み提出期限前かつ元の `FAILED` の `verified-result.at` 以前でなければなりません。正常終了も同じ提出期限前・観測時刻以前で、後続の実行がないことを要求します。準備済みの完全なツリー、元セッション・設定・指示・実行観測の照合は維持します。
    時刻拒否は終了コード1に加え、標準出力へ非秘密JSONを返します。`failedChecks` に全失敗比較、`timing.submissionDeadline` に採用期限を示し、元期限・延長後期限・予約秒数・失敗記録時刻を区別できます。`remainingEligibility:NOT_EVALUATED` は、後続の回答・実行観測・ツリー照合が未実施という意味です。
    追記できるのは `REQUEST_CHANGES` の指摘だけです。元の失敗結果、`Task`、`Flow`、所有者、利用量と既存記録は変更しません。モデル再送、製品検証、品質合格、修正実行、完了は許可しません。`--preview` を確認し、別途承認した `expectedHash` で適用します。
    変更していない `.env.ci.example` が秘密検査前に拒否される挙動は、インデックス全体の `.env.*` 禁止方針によるものです。今回、この方針や秘密検査を緩和しません。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.25` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.25 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。追記操作の条件とJSONはCLIリファレンスおよび `workflow record-failed-review --help` を参照してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.24` です。失敗記録後の正常終了を持つ指摘記録は旧版の読取り条件に適合しません。その記録を保存したデータベースを旧版で操作せず、現状を保護して適用前の整合バックアップを別配置で使います。成果・停止履歴・指摘・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    匿名化時系列を使った合成再現と保存状態・ローカルSDK通信の検査であり、運用台帳や元セッションへ接続していません。個別実行の全原本や適格性、運用受入れ完了は未確認です。表示されたフロー期限だけで提出期限内とは断定できず、保存済み延長と未使用修正枠の予約も照合します。`APPROVE`、`BLOCKED`、`commit` モード、復元した作業台帳、変更・解放済みのレビュー用作業場所、他プロバイダーは対象外です。正常終了時の利用量集計は補助証拠で、照合済み消費や残予算ではありません。設計と否定条件は `ADR-0072` を参照してください。OpenCode ACP、保存課金契約、認証付きMCPの実サービス受入れも引き続き未完了です。
changelog:
  disable: true
