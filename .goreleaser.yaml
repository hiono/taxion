version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    `v0.7.14` からの改善をまとめています。
    新規利用の標準を `account`・`reset-daily` に変更しました。`taxion request --repo REPO --max-ai-credits 30` で Task 上限の手入力を省略でき、読取り範囲と残量方式を表示して `/plan`・`/approve` の承認に含めます。
    残量下限は開始時の残り率を基にリセットまで日割りで下がり、最後の24時間は0になります。実際の残量ゼロでは送信を拒否します。
    選択したアカウントの残量を送信前だけでなく、実行中も約1分ごとと最終回答の採用前に確認します。計画・質問・検索も対象とし、送信時と以後の観測を分けて保存します。古いキャッシュを使わず、選択したアカウントを照合して取得します。
    中断したレビューでは対象成果に結び付く進捗を保存し、期限と再利用候補を確認できるようにしました。成功済みの実装をレビューだけの後続実行へ渡す際は、元の検証証跡を元の承認と照合し、新しい承認との取り違えを防ぎます。
    公開情報の検査は、GitHub のイベントとコミットメッセージも対象にしました。
    
    ## Compatibility
    
    保存済み Task・送信記録・中断記録の方式、承認、期限、正の明示上限は維持します。再開時は保存した方式を使い、新しい既定値を遡及適用しません。
    設定や依頼で明示した `flow`・`off` は引き継ぎ用として使えます。新方式にも正の追加上限を指定できます。`nano-AIU` と残量割合の換算値や仮の上限は作りません。
    残量方式では取得不能・非対応・古い観測・リセット不明を拒否し、旧方式へ自動で切り替えません。上限省略方式の監視を実行時に無効化することも拒否します。
    `OpenCode` は残量非対応のため新方式を実行できません。承認済みの旧方式と期限・上限を明示して利用します。
    停止済みのフローは自動で再開しません。成功済み成果のレビュー継続には、同じ成果と元の証跡を照合した後続 Task の承認が必要です。途中の思考やモデル内部状態の移送は保証しません。
    
    ## Upgrade
    
    mise の GitHub 対応機能で `v0.7.16` に固定し、配布情報、ファイルのハッシュ、公開処理全体の成功を照合してください。
    保存状態と設定を保護し、稼働中の処理を停止・照合してから、新しい配布情報と実行ファイルのパスを再承認します。既存の運用設定を自動更新したり、承認済み上限を削除したりしません。
    新規の標準方式と過去の資産の引継ぎは、利用者ガイド、設定ガイド、CLI、実行記録、`ADR-0049` に記載しています。
    
    ## Rollback
    
    配布情報で検証した戻し先は `v0.7.15` です。旧配布物の撤回により、`v0.7.15` 自体にはそれ以前への戻し先がありません。
    実行ファイルを戻しても保存状態、承認、期限、予算、残量の開始基準は巻き戻しません。新しい残量配分・上限省略・進捗記録を含む契約は旧版で再利用せず、停止と証跡の保全を優先してください。
    
    ## Known limitations
    
    残量は提供元の観測値です。反映遅延、確認間隔、停止までの消費があるため、厳密な請求上限は保証しません。最終24時間は親の報告用残量も保証しません。
    不明な使用量を無料・計測完了には置き換えません。`requests` の割合を `AI credits` や `nano-AIU` へ読み替えません。
    合成テストと実作業の効果は別です。特定製品の作業成功、レビューの誤読解消、全体費用の削減を、この公開だけで実証したとは扱いません。
    実装役の明示許可シェルは隔離環境ではありません。間接起動するプロセスの制約には別の隔離が必要で、レビュー役のシェル拒否は維持します。
changelog:
  disable: true
