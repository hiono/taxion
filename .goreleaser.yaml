version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    契約形態、超過課金、自動チャージ、有料の自動切替えを Taxion のローカル設定として申告できるようにしました。型・既定値・整合性の判断を `internal/core/billing.go` に集約し、設定と CLI の説明は課金ガイドを参照します。
    新規提案の既定は「提供元の上限で停止し、追加課金・自動チャージ・有料切替えを使わない」という申告に基づく `provider` 方式です。承認した場合は利用額上限を省略でき、自動の残量照会を行いません。月内配分の厳格な監視は `account` を明示して選べます。
    `taxion config check --billing` は、新規提案用の条件・方式・適用先・設定元を JSON で表示します。提供元の課金設定変更やモデル起動は行いません。
    
    ## Compatibility
    
    新規の条件は承認へ保存し、既存の Task・`Flow`・`Dispatch`・再開用記録を再解釈しません。旧方式、正の利用額上限、期限、実行数、修正回数、権限と独立レビューを維持します。
    課金条件が従量課金・未確認の場合や、追加課金・自動チャージ・有料切替えを否定できない場合は `provider` を選べません。方式を省略すると `flow` を選び、正の利用額上限が必要です。
    
    ## Upgrade
    
    mise の GitHub 対応機能で `v0.7.19` に固定し、配布情報、ファイルのハッシュ、公開処理全体の成功を照合してください。
    保存状態と設定を保護し、稼働中の処理を停止・照合してから、新しい配布情報と実行ファイルのパスを再承認します。既存の運用設定を自動更新したり、承認済み上限を削除したりしません。
    実際の契約は提供元で確認し、`billing.contract`・`billing.overage`・`billing.autoRecharge`・`billing.paidFallback` に申告します。保存済みの必須監視を変更する場合は新たな契約として承認してください。
    
    ## Rollback
    
    戻し先は配布情報で検証する `v0.7.18` です。新しい課金条件・方式を含む保存状態は旧版で再利用しません。停止を確認したうえで、更新前の整合したバックアップを使ってください。停止履歴や承認を削除して戻すことはしません。
    
    ## Known limitations
    
    課金条件は人間の申告であり、提供元の API による契約検証や請求額の保証ではありません。提供元の契約・決済設定を変更せず、追加利用も購入しません。`provider` は月内の残量を温存せず、申告と提供元表示の不一致を自動発見しません。
    `account` の取得不能時の停止、5秒の照会期限、再試行なしの動作は維持します。取消要求が残った場合は正式な停止確認が必要です。停止済みの作業は自動再開せず、異なる利用単位の換算や不明な使用量の無料扱いも行いません。
changelog:
  disable: true
