version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added
    
    `ADR-0055` に、承認済みの目的・受入れ条件・作業範囲・権限・残予算・期限を保ち、手段は状況に応じて選ぶ全体方針を記録しました。内部の形式や互換性のある版変更だけで、同じ判断を取り直さない方針です。
    
    ## Fixed
    
    承認束を要求する保存形式では、正式な `conversation confirm` と同じ保存処理で ApprovalBundle を導出します。以前の正式確認も、元の完全一致する要求・提案・履歴・未実行の契約・設定が揃う場合に限り、不足する束を追記できます。旧形式の暗黙移行、元の承認や履歴の書換えは行いません。既存の承認が独立レビュー設定を含む場合は、同じ範囲への任意の役割連携の承認を重ねません。
    製品の実装・レビュー担当と、Taxion を操作する外側の担当を共通指示で区別します。Copilot の実装・レビュー担当は、新規接続・再接続ともに SDK の `DisabledSkills` に同名の `taxion` 管理スキルを指定します。他の製品スキル・承認済み拡張機能の参照先と既存権限は変更しません。管理情報への読取り拒否や管理用シェルの不足だけを理由に、製品作業を停止しないよう指示します。
    除外設定はセッション識別に含めます。診断は除外一覧と、内容だけを固定した資産の `pinned-content` 表示を区別します。前の試験版の整合回復、組み込み MCP 分離、承認束と工程計画の区別は維持します。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.4` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、元の明示保存先と状態を保護してから新しい配布物のパスと固定値を適用してください。既存の導入許可の範囲を使い、新しい権限を推定しません。
    管理スキルは 1.3.7 です。更新を許可されている場合は、旧ファイルを保全して `ready --update-skill` を実行し、`ready --check-skill` と `ready` を確認します。管理スキルは外側の操作者専用です。旧セッションの識別を新しい指示へ書き換えたり、終端の実行を再送したりしません。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。整合回復の監査や工程計画を保存したデータベースを旧版で更新しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    設定と指示の回帰試験であり、実モデルの役割遵守や実際の製品作業完了の証明ではありません。同名スキルの除外は任意の別名スキルやファイル内容の混入を完全に防ぐ隔離機構ではありません。共通指示は両実行経路に適用しますが、SDK による名前付き除外設定は Copilot の機能です。
    Copilot・OpenCode の互換更新・自動取得・切替・継続判断の自動化は未実装です。新たな有料実行、権限・期限・予算の拡張をこの更新から推定しません。配送・利用量の不明点、停止理由、保存成果を保全し、適用条件外の整合回復や未知の配送の再送は行いません。
changelog:
  disable: true
