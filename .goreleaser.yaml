version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    `v0.7.21-rc.11` のレビュー復旧は元期限内の継続だけを認めていたため、期限切れ後は未来の期限と元期限以下という条件を同時に満たせませんでした。`workflow recover-review` に明示的な `deadlineRecontract` を追加し、期限切れ後も同じ候補・合格した入力検証記録・保存済み解析を使う後続レビューの再契約を準備できます。
    `previousDeadline` に保存された旧期限、`deadline` に要求本体と同じ未来の新期限、`reason` に変更理由を指定します。旧期限より後の新期限を一つの外側ハッシュに結び付け、変更への正確な承認後に原子的に保存します。旧工程の期限・指示・セッション・消費・作業場所は書き換えません。下位の契約・計画ごとに承認を要求しません。
    未開始と正式停止済みの実行済み成果物レビューの双方に対応します。実行済みでは `continueStoppedExecution:true` と正確な停止記録が引き続き必要です。入力検証の合格記録と保存解析を引き継ぎ、実装担当や入力検証を再実行せず、レビュー結果の受理検証は維持します。明示的な再契約なしの期限延長は引き続き拒否します。
    CLI、管理スキル、`ADR-0058`、利用手順、実行と保存の契約を同じ修正へ含めます。候補・設定・停止証拠・登録済み作業場所・未解決実行の照合を省略せず、期限切れを消費履歴のリセットや成果破棄の理由にしません。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.12` を明示選択します。安定版の自動更新先にはしません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新しい配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.18 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    期限の再契約は後続工程への明示承認であり、期限切れの旧工程や終端セッションの再開ではありません。新期限が適用時にも未来であることを要求します。予算の追加、累計消費のリセット、不明な実行の自動再試行、公開権限は含みません。モデル起動は通常の実行前検査を通します。
    未保存の思考の復元は行いません。稼働実行・未解決の保留・候補や証拠の不一致は保全して拒否します。旧版で新しい再契約監査を操作しないでください。製品環境への導入・復旧成功は配布検証と別の受入れです。
changelog:
  disable: true
