version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.releaseVersion={{.Version}} -X main.releaseRevision={{.FullCommit}} -X main.releaseBuiltAt={{.Date}} -X main.releaseChannel={{if .IsSnapshot}}development{{else}}release{{end}}
archives:
  - id: taxion
    ids:
      - taxion
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: checksums.txt
