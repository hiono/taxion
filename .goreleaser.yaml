version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    新しい実装指示は `changeManifestPolicy: git-diff-v1` を保存します。コントローラが Git から基準点と対象成果物の全差分を確認し、`changedFiles` を確定します。今回編集した一部だけの申告、省略、重複、過剰な申告を理由に、追加の実装実行や再提出を要求しません。元の申告一覧は `changeManifest.reportedChangedFiles` に保持します。
    コミットとツリースナップショット、直接の結果受理と自動実行で共通の検査を使います。実際の範囲外変更、成果物の不一致、差分取得不能は拒否し、同じ成果物の実検証と独立レビューを維持します。保存済みの結果や旧指示は書き換えません。
    `workflow repair-status` は、停止・引継ぎ保留・結果不一致を `reconciliation-required` として、未回答の選択を表す `human-decision-required` と区別します。計画・質問・実装・レビュー・復旧・公開の共通指示にも、既存承認と証拠で解消できる差異を先に処理する方針を反映しました。修正前に必要な失敗診断を実指示へ渡す案内も含みます。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.7` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、元の実行終了と状態保全を確認してから固定値を更新してください。
    管理スキルは 1.3.12 です。更新を許可されている場合は旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。新しい変更一覧の処理は新規発行の指示だけに適用します。旧指示の失敗結果を編集して受理させず、保全済み成果を正式な後続契約へ引き継いでください。
    `workflow repair-status` の JSON は `version: 1` のまま状態値を追加しています。外部で状態値を固定列挙している場合は `reconciliation-required` に対応してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    既存承認で解決できる差異と新しい意思決定を区別する変更であり、任意の停止を自動解除する機能ではありません。範囲変更後の正式契約更新、旧実行の停止確認、必要な実行承認は維持します。`reconciliation-required` は再実行や引継ぎ保留の解除を許可しません。
    低速出力の原因測定、自動的な残量保証、範囲追加から後続開始までの一括自動復旧は含みません。製品環境での適用確認は未実施であり、配布自体は製品の品質合格を意味しません。追加の定期点検機能はこの配布に含みません。
    検証コマンドは承認済みの権限で任意のコードを実行できます。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
