version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added
    
    工程制御を確認するための試験版です。`stageBudget` を指定した要求を `workflow plan --file JSON` で事前確認し、計画のハッシュを明示承認してから開始します。元の全体期限から検証・独立レビュー・許可済み修正の時間を確保し、実装担当の提出期限を制御します。
    提出と検証は別の期限で監視します。時間切れでは部分成果と停止証拠を保存し、未完了の結果を成功として受理しません。`workflow budget --id ID` で工程時刻・適用上限・使用量の単位と完全性・保存成果を読取り専用で確認できます。
    
    ## Fixed
    
    セッションのクレジット上限を工程配分と誤認しないよう、`ready`、管理スキル、利用手順を更新しました。計画付きの実行では保存した役割別ソフト上限を適用し、共通の実行オプションで黙って置き換えません。正の全体利用額上限がある場合、必須役割の見積もりがなければ計画を拒否します。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.1` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、状態と設定を保護してから新しい配布物のパスと固定値を承認してください。
    管理スキルは 1.3.3 です。`ready --check-skill` が不一致を返したら、旧ファイルを保全し、明示許可を得て `ready --update-skill` を実行します。その後、互換性確認と `ready` を行います。旧 `Flow` の計画を変更せず、新しい Task と工程計画を承認してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。工程計画や工程監査を保存したデータベースを旧版で更新しないでください。現状を保護し、試験前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    工程計画は任意です。計画なしの旧 `Flow` と `request` は後続工程の時間を予約しません。見積もりは完了保証でも提供元のクレジット予約でもなく、セッションの上限は厳密な請求上限を保証しません。提供元停止方式に自動の残量照会は追加しません。
    監視プロセスの異常終了中は提供元を能動停止できません。合成試験で制御を確認していますが、実モデルでの完了率・費用改善は未確認です。試験版の導入はモデル実行の許可を兼ねず、実行条件と外枠は別途承認が必要です。
changelog:
  disable: true
