version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    同じアカウントに `Copilot` の保存認証と `gh` の認証があると、残量の照会先を選べず停止する問題を修正しました。現在の認証種別・GitHub のホスト・アカウントを照合し、対応する認証情報で新しい残量を取得します。照会だけではモデルの実行単位を作りません。
    レビューだけの継続で `objective` または出力方式が異なる場合、`scope` や `acceptance` の不一致と誤表示していた診断を分けました。元の全体目的を保持し、`continueFromDispatchId` でレビューだけの実行を選ぶ手順を文書に追記しました。
    
    ## Compatibility
    
    新規利用の `account`・`reset-daily` の標準、保存済みの承認・期限・明示上限は変更しません。同じ認証種別に候補が複数残る場合や、現在の認証・資格情報が不明な場合は引き続き停止します。認証の削除や切替えは行いません。
    継続時の目的・`scope`・`acceptance`・出力方式・`security`・実行設定・成果物の照合条件は緩めません。既に異なる目的で承認した Task は上書きせず、元の目的を保持した別の後続 Task を承認します。完了済み成果と検証証跡を再利用し、実装をやり直す必要はありません。
    
    ## Upgrade
    
    mise の GitHub 対応機能で `v0.7.17` に固定し、配布情報、ファイルのハッシュ、公開処理全体の成功を照合してください。
    保存状態と設定を保護し、稼働中の処理を停止・照合してから、新しい配布情報と実行ファイルのパスを再承認します。既存の運用設定を自動更新したり、承認済み上限を削除したりしません。
    
    ## Rollback
    
    戻し先は配布情報で検証する `v0.7.16` です。実行ファイルを戻しても保存状態、承認、期限、予算、残量の開始基準は巻き戻しません。認証情報が重複する環境では旧版の停止が再発し得ます。
    
    ## Known limitations
    
    残量は提供元の観測値です。反映遅延、確認間隔、停止までの消費があるため、厳密な請求上限は保証しません。最終24時間は親の報告用残量も保証しません。
    不明な使用量を無料・計測完了には置き換えません。`requests` の割合を `AI credits` や `nano-AIU` へ読み替えません。
    停止済みのフローは自動で再開しません。実作業の再開成功は別途確認が必要で、この公開だけでは実証していません。
changelog:
  disable: true
