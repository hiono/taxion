version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    持込み成果物の入力検証に合格した後、レビュー準備に失敗して停止した場合の正式な復旧操作を追加します。`workflow reconcile-stopped` は、開始や応答の記録がない最初のレビュー指示を、配送不明と旧停止を保持して取り消せます。
    正式な後続契約で `reuseArtifactValidation:true` を指定すると、同じ候補・元の作業場所・検証契約・実効設定を再照合し、合格した入力検証の記録を引き継ぎます。元の入力検証工程と実装担当の再実行は不要です。独立レビューと、その結果受理時の既存検証は維持します。
    `validationSourceFlowId` と `INPUT_VALIDATION_REUSED` の監査が元の実施記録と整合回復を結び付けます。旧停止や元の検証時刻を書き換えず、既存のレビュー用作業場所も削除しません。手順と適用条件は `ADR-0058` に記録しています。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.8` を明示選択します。安定版の自動更新先にはしません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    管理スキルは 1.3.13 です。更新を許可されている場合は旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。新しいレビュー用の場所はコントローラが作成するため、事前点検で作成しないでください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    対象は、入力検証合格後の最初のレビュー指示で、応答・開始・実行セッション・結果・実行記録・管理済みレビュー用作業場所がない場合に限ります。実行停止の確認証拠、配送不明の受容、現在のハッシュ照合、後続契約と工程計画の承認は必要です。
    任意の停止解除、利用量の自動保証、低速出力の原因測定、追加の定期点検機能は含みません。製品環境での適用確認は未実施であり、配布自体は製品の品質合格を意味しません。
    検証コマンドは承認済みの権限で任意のコードを実行できます。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
