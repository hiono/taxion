version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    アカウント残量の読み取りを承認している場合、残量が5%以下になると新しい実行を拒否します。
    その日の開始時点の残量から5%を除いた量を、次のリセットまでの日数（当日を含む）で割ります。その日の使用量がこの値に達した場合も、新しい実行を拒否します。
    拒否した実行は実行中の状態に残らないため、残量が回復した後に再試行できます。
    残量のリセット日時は、観測時刻ではなくアカウントのリセット日時から読み取るように修正しました。
    配布情報の戻し先は、固定値ではなく、現行版より古い公開済みの最新の正式版から決めるようにしました。
    実行ファイルは、v0.7.9 以降の正式版で現行版より古い戻し先を受け入れます。
    v0.7.12 は公開前の検証で停止したため公開していません。この版は v0.7.12 の変更をすべて含みます。
    
    ## Compatibility
    
    残量の読み取りを承認していない場合、または残量を読み取れない場合の動作は従来どおりです。
    時間の上限と `maxNanoAiu` の扱いは変わりません。
    
    ## Upgrade
    
    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    
    ## Rollback
    
    戻し先の `v0.7.11` は、6環境すべてに対応する正式配布ファイルを使用します。
    `v0.7.11` へ戻すと、残量に基づく実行の拒否はなくなります。時間の上限の既定値は維持されます。
    
    ## Known limitations
    
    残量を読み取れる実行環境は1種類だけです。それ以外の実行環境には時間の上限だけを適用します。
    実行の途中では残量を読み直しません。5%の予備は暫定値です。
changelog:
  disable: true
