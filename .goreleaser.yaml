version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    完了・品質判定を、同一対象に対する検証とGit証拠へ結び付けます。保存済み結果や利用者の申告だけでは、独立検証済みの品質合格として扱いません。
    ACPの失敗診断に既知の提供元制限情報を秘匿して表示する仕組みを追加します。個別の停止原因を確定するものではなく、自動再送や有料経路への切替も行いません。
    `config check --billing --task ID` と `--dispatch ID` で、ローカルの保存済み課金契約を表示し、現在の設定と照合します。実サービスの課金枠・制限の確認や受入れ、利用枠の残量取得は含みません。
    認証付きMCP操作では、承認した要求だけを一回限りで仲介し、秘密を含み得る応答をモデルや保存記録へ返しません。この仲介はコード上の制御であり、プロセスを隔離しません。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.22` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.22 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.21` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    OpenCode ACP接続と保存済み課金契約の実サービス受入れ、および認証付きMCP操作の実サービス・オペレーティングシステム隔離受入れは未完了です。合成試験はこれらの受入れを代替しません。認証付きMCPの仲介はオペレーティングシステムによる隔離を提供せず、ホストとMCP実装は信頼対象です。詳細と未達条件はIssue #229、#231、#234に記録しています。
changelog:
  disable: true
