name: Temporary branch validation

on:
  push:
    branches:
      - fix/role-handoff-e2e-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Full test suite
        run: go test -count=1 ./...
      - name: Full race suite
        run: go test -race -timeout 20m -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
