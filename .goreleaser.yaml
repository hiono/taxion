version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added
    
    安全停止した初回指示の整合回復に `workflow reconcile-stopped --file JSON` を追加しました。引継ぎ保留・所有者不在の `STOPPED / SAFETY_STOP` と、開始記録のない初回スナップショット入力の実装指示だけを対象にします。人が継続中の実行がないことを確認した根拠、配送不明の受入れ、事前確認の完全ハッシュを要求します。
    
    ## Fixed
    
    取消・Task の `BLOCKED` 遷移・監査追記を同じ保存処理で行い、元の停止理由・保留・承認・期限・予算を保持します。以前からある入力ツリーを、停止した実装担当の新成果として記録しません。
    後続 Task は、同じリポジトリの別作業場所で承認済み入力を照合し、提案と正式確認の両方に `reconciliationHash` を含めます。新提案の完全ハッシュと取消後の正確な対象を要求し、旧指示を再送せず、新しい実行も自動発行しません。
    前の試験版の組み込み MCP 分離、承認束と工程計画の区別、GitLab 読取り失敗の診断は維持します。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.3` を明示選択します。安定版の自動更新先にはしません。配布情報・ハッシュ・公開処理全体の成功を照合し、元の明示保存先と状態を保護してから新しい配布物のパスと固定値を承認してください。
    管理スキルは 1.3.5 です。`ready --check-skill` が不一致を返したら、旧ファイルを保全し、明示許可を得て `ready --update-skill` を実行します。その後、互換性確認と `ready` を行います。導入、整合回復の適用、後続契約、有料実行の承認は分けます。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。整合回復の監査や工程計画を保存したデータベースを旧版で更新しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    整合回復は外部実行を停止・照会しません。記録がないことや人の確認だけで、未配信・未実行・無課金を証明せず、配送は `unknown`、利用量は `unavailable` のままです。セッション・結果・実行時の受領記録がある場合、入力が変わった場合、他の実行が稼働中の場合には使えません。一般的な停止解除やデータベースの正本集約は含みません。
    GitLab の一時失敗の原因と実製品での復旧結果は未確認です。組み込み MCP の分離は他の通信経路も禁止する隔離機能ではなく、工程見積もりやセッション上限も完了・厳密な請求上限を保証しません。新しい実行の承認束・役割委譲・工程計画・実行時検査は省略しません。
changelog:
  disable: true
