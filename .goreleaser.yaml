version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    正式に `FAILED` となった `Reviewer` の保存済み `REQUEST_CHANGES` を、`workflow record-failed-review` で追加の正式な指摘記録として追記できます。元の失敗結果、`Task`、`Flow`、所有者、利用量と実行記録は変更しません。モデル再送、製品検証の再実行、品質合格、修正実行、完了を許可する操作ではありません。
    元の `Copilot` セッション、設定、指示、保存済み実行観測、準備済みの完全なツリーを照合し、最終回答・ターン終了・正常終了記録が元の提出期限内かつ正式失敗以前であることを要求します。`--preview` の内容を承認した後、同じ判断の `expectedHash` で適用します。`APPROVE`、`BLOCKED`、別セッション、変更・解放済みのレビュー用作業場所は拒否します。
    管理スキルに保存状態から復旧手順を選ぶ表と原本・観測・正式結果の区別を追加しました。通常レビューの差分基点と後続判断の条件表も整備しました。
    変更していない `.env.ci.example` が秘密検査前に拒否される挙動は、インデックス全体の `.env.*` 禁止方針によるものです。今回、この方針や秘密検査を緩和しません。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.24` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.24 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。追記操作の条件とJSONはCLIリファレンスおよび `workflow record-failed-review --help` を参照してください。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.23` です。この追記操作は含まれません。新しい指摘記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・指摘・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    指摘追記は合成Gitリポジトリ、保存状態とローカルSDK通信相手で検証しています。報告された運用事象の原本一式は未提供で、個別実行の適格性や運用上の受入れ完了は確認していません。`commit` モード、復元した作業台帳、変更・解放済みのレビュー用作業場所、他プロバイダーは追記対象外です。正常終了時の利用量集計は追加証拠に留め、照合済み消費や新しい残予算として扱いません。後続の修正・再レビューには別の明示承認が必要です。条件表は `ADR-0072`、検証範囲はIssue #268とPR #269に記録しています。OpenCode ACP、保存課金契約、認証付きMCPの実サービス受入れも引き続き未完了です。
changelog:
  disable: true
