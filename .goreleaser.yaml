version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added

    公開文章に使う指針の読者、公開範囲、言語、文書種別をプロジェクトの設定と照合します。
    公開OSS向けには専用の指針を使い、重要な文章は独立した読者観点の確認を必要とします。
    未送信の公開予定を内容と承認に結び付けて取り消す `records cancel` を追加します。

    ## Changed

    非公開プロジェクトの本番設定には、見出し、文書構成、機密情報、訂正の方針を明示します。
    GitLab の既存文章を変更せず検査する機能を追加します。結果は公開リポジトリの外へ保存します。
    配布前にソースの作業場所と未保存の変更、古い作業場所、既存の生成物を検査します。

    ## Fixed

    取り消した公開予定は送信できず、同じ識別子を別の内容に再利用できません。

    ## Security

    この保護は協調的な誤使用防止です。ローカル管理者や旧実行ファイルによるアクセスを隔離する機能はありません。
    指針のメタデータと独立レビューの記録は信頼する設定です。自動検査だけで文章の意味や事実を完全に保証しません。

    ## Compatibility

    Windows でのシェル検証は、`Unix` のプロセスグループ取消機能を必要とするため未対応です。
    外部公開には `TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256` の保護対象一覧と、`TAXION_COMMUNICATION_PROFILES` の明示設定、互換性のある文章指針が必要です。

    ## Upgrade

    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    外部公開の設定へ指針のメタデータを追加してください。必要な独立レビューは本文と設定に一致する記録を使用します。
    旧承認の本文を変更せずに送信できない場合は、未送信の予定を取り消してから、新しい識別子で承認してください。

    ## Rollback

    戻し先の `v0.7.9` は各環境に一致する正式配布ファイルを使用します。
    `v0.7.8` は `linux-amd64` のみ利用可能で、他の5環境には対応する配布ファイルがありません。
    旧版への実行ファイル切替は、新しい配布元検証を必要とする製品向け操作の継続を許可しません。

    ## Known limitations

    他の5環境には `v0.7.8` の配布ファイルがありません。未提供の戻し先は利用可能として扱いません。
    識別子の検査は設定した語に限定されます。送信済み、送信中、送信結果が不明の予定は取り消せません。
    既存文章の検査は意味と事実の独立確認を代替しません。所有者が不明または未保存の変更がある作業場所は自動削除しません。
changelog:
  disable: true
