version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    `workflow start` の要求で `timeoutSeconds` を省略するか0を指定すると、実行の期限は開始から1時間になります。
    呼び出し側の期限がそれより早い場合は、その期限を使います。呼び出し側の期限を過ぎている場合は、実行を開始しません。
    `request` の `--timeout` は省略できるようになり、既定値は1時間です。明示した値の扱いは変わりません。
    
    ## Compatibility
    
    `timeoutSeconds` に負の値を指定した要求は、従来どおり拒否します。
    利用量の上限 `maxNanoAiu` と `--max-task-nano-aiu` は、従来どおり明示が必要です。
    
    ## Upgrade
    
    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    期限を明示している既存の要求は、変更せずに使用できます。
    
    ## Rollback
    
    戻し先の `v0.7.10` は、6環境すべてに対応する正式配布ファイルを使用します。
    `v0.7.10` では、`workflow start` の `timeoutSeconds` の省略または0を拒否し、`request` では `--timeout` の指定が必要です。
    戻す前に、それぞれの期限を明示してください。
    
    ## Known limitations
    
    既定値は時間の上限だけに適用します。アカウントの残量に基づく 利用量の制御は未実装です。
changelog:
  disable: true
