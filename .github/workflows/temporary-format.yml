name: Temporary Go formatting

on:
  push:
    branches:
      - feat/planning-authorization-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format and push
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -z "$files" ]; then
            exit 0
          fi
          gofmt -w $files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "fixup! chore: gofmt Planning lifecycle Store"
          git push origin "HEAD:${GITHUB_REF_NAME}"
