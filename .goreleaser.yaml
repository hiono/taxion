version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Added

    Linux、macOS、Windows の amd64 / arm64 向け配布ファイルを提供します。
    正式公開後は mise の GitHub 対応機能で、Go コンパイラーやソースの取得なしに導入できます。
    製品向けの操作は、明示した設定と正式な配布情報、配布ファイルと実行ファイルのハッシュ、
    埋込み版番号とソースのリビジョン、mise 管理下の実パスを検証してから開始します。
    ソースからのビルドは隔離した開発環境用です。

    ## Changed

    開発用と製品用の保存先の設定を明示的に区別します。
    プロジェクトごとに公開文章の言語と読者を設定し、GitHub / GitLab への送信直前に本文と参照先を検査します。

    ## Fixed

    正式配布の検証条件を満たさない実行ファイルの誤使用を拒否します。

    ## Security

    この保護は協調的な誤使用防止です。ローカル管理者や旧実行ファイルによるアクセスを隔離する機能はありません。

    ## Compatibility

    Windows でのシェル検証は、`Unix` のプロセスグループ取消機能を必要とするため未対応です。
    外部公開には `TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256` の有効な保護対象一覧と、`TAXION_COMMUNICATION_PROFILES` の明示設定が必要です。未設定・空・不正値では公開しません。

    ## Upgrade

    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    外部公開を利用する環境では、設定ガイドに従って保護対象識別子のダイジェスト一覧と対象プロジェクトの言語・読者を設定してください。未送信の旧承認は、新しい設定と記述時点を含む内容で再承認してください。

    ## Rollback

    戻し先の `v0.7.8` は `linux-amd64` のみ利用可能です。
    旧版への実行ファイル切替は、新しい配布元検証を必要とする製品向け操作の継続を許可しません。

    ## Known limitations

    他の5環境には `v0.7.8` の配布ファイルがありません。未提供の戻し先は利用可能として扱いません。
    識別子の検査は設定した語に限定されます。旧版で承認した未送信本文が新方針に違反する場合は送信できず、取消操作もまだありません。
changelog:
  disable: true
