version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    `Copilot` の実行環境では、実装役が割り当てられた作業ツリーの中で、ビルドやテストなどの手元のコマンドを1回ごとの許可で実行できるようになりました。
    この許可は、実装役のツール一覧に `bash` または `powershell` を含めた場合だけ有効です。
    接続先が報告された要求と、直接指定した `gh`、`curl`、`ssh`、Git の更新、入れ子のシェル、`.git` と作業ツリー外のパスは拒否します。
    レビュー役のシェルは引き続き拒否します。
    `taxion workflow repair-status --id FLOW` を追加しました。保存済みのフローを読み取り専用で調べ、次の修正を人間に確認せずに進めてよいかを返します。
    停止済みのフローを実行しようとした場合は、標準エラーにこの分類と確認用のコマンドを表示します。標準出力の内容は変わりません。
    配布情報の `schemaVersion: 3` で、旧配布物の撤回によって戻し先がない状態を明示します。`provenance verify` にも、その理由を表示します。
    
    ## Compatibility
    
    実装役のツール一覧にシェルを含めない既定の構成では、シェルは従来どおり拒否されます。
    OpenCode の実行環境では、シェルは従来どおり拒否されます。
    停止済みのフローは従来どおり終端状態で、自動では再開しません。
    配布情報の `schemaVersion: 2` は引き続き検証できます。`schemaVersion: 3` は `v0.7.15` 以降の実行ファイルが必要です。
    
    ## Upgrade
    
    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    旧配布物は撤回しました。既存の版の配布ファイルを差し替えず、新しい版として配布します。
    既存の運用設定は自動更新しません。実行中の処理を停止して保存状態と設定を保護し、新しい配布情報と実行ファイルのパスを再承認してください。
    
    ## Rollback
    
    `v0.7.15` には、利用可能な旧版への戻し先がありません。配布情報の `rollbackVersion` は空文字列、`rollbackPlatforms` は空の配列、`rollbackUnavailableReason` は `prior-distributions-withdrawn` です。
    別の版への切替を成功と扱わず、同じ固定版の再導入、選択設定の解除、アンインストールだけを復旧手段とします。保存状態、承認、期限、予算は巻き戻しません。
    
    ## Known limitations
    
    シェルの検査は、解析したコマンドに対する拒否リストであり、隔離環境ではありません。
    `make`、スクリプトの実行系、`find -exec` などが内部で起動するプロセスは検査しません。ネットワークや作業ツリー外への書込みを確実に止めるには、実行環境の隔離が別に必要です。
    `workflow repair-status` は、Git の証拠、記憶、承認済みの指示案を検証しません。これらは `workflow advance` が続行時に検証します。
    公開履歴の更新と旧配布物の撤回は、外部の複製やキャッシュまで消去されたことを保証しません。
changelog:
  disable: true
