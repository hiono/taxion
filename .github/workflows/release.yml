name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -z "$(git status --porcelain)"
          test -z "$(gofmt -l cmd internal)"
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -count=1 ./...
          go test -count=1 -race -timeout 30m ./...
          go build ./...
          python3 -m unittest discover -s scripts
          npm --prefix web test
          ! git grep -nE 'gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- ':!.github/workflows/*'
      - name: Documentation and local links (no network)
        run: go test -count=1 ./cmd/taxion -run '^(TestDocumentation|TestConfigurationGuide|TestUserGuide)'
      - name: Public communication policy and generated comments
        env:
          TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256: ${{ secrets.PUBLIC_TEXT_PRIVATE_IDENTIFIER_SHA256 }}
        run: |
          go test -count=1 ./internal/publictext ./internal/forge ./scripts/publictext
          go run ./scripts/publictext -repository
  package:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
      - name: Refuse existing release and prepare metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py require-absent --tag "$GITHUB_REF_NAME"
          echo "TAXION_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          python3 scripts/release.py prepare --tag "$GITHUB_REF_NAME"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: v2.18.3
          args: release --clean --skip=publish
      - name: Check exact release text and create draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAXION_COMMUNICATION_PROFILES: .github/communication-profiles.json
          TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256: ${{ secrets.PUBLIC_TEXT_PRIVATE_IDENTIFIER_SHA256 }}
        run: |
          python3 scripts/release.py manifest --tag "$GITHUB_REF_NAME"
          go run ./scripts/publictext -release "$GITHUB_REF_NAME" > .release/public-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Taxion $(cat VERSION)" --notes-file .release/public-notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            dist/release-manifest.json dist/release-manifest.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/release-manifest.*
  native-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-archives
          path: dist
      - run: python scripts/release.py smoke
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.0
          install: false
      - run: python scripts/mise_smoke.py --staged-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
  publish:
    needs: native-smoke
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-archives
          path: dist
      - name: Finalize draft then verify every published asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hiono/taxion
          TAXION_COMMUNICATION_PROFILES: .github/communication-profiles.json
          TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256: ${{ secrets.PUBLIC_TEXT_PRIVATE_IDENTIFIER_SHA256 }}
        run: |
          go run ./scripts/publictext -release "$GITHUB_REF_NAME" > verified-notes.md
          gh release view "$GITHUB_REF_NAME" --json name,body,tagName,isDraft > current-release.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path("current-release.json").read_text())
          if (release["tagName"] != os.environ["GITHUB_REF_NAME"] or not release["isDraft"]
              or release["name"] != "Taxion " + pathlib.Path("VERSION").read_text().strip()
              or release["body"] != pathlib.Path("verified-notes.md").read_text()):
              raise SystemExit("Draft identity or public text differs from the checked release")
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release download "$GITHUB_REF_NAME" --dir public
          python3 scripts/release.py verify-published --tag "$GITHUB_REF_NAME"
          cd public
          sha256sum -c SHA256SUMS
          sha256sum -c release-manifest.sha256
  mise-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.0
          install: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" --dir dist
      - run: python scripts/mise_smoke.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
