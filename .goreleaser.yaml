version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    人が作った成果物や保存済みの失敗記録を、実装担当を起動せず目的別に検証・独立レビューできます。持込み入力の検証、診断、品質レビューを区別し、承認した対象と同じ入力の証拠を結果受理まで照合します。
    現在の入力の観測、旧契約への適合、新しい仕事への受入れ、実行許可を分離します。停止時の部分成果が未記録でも、許可した範囲の現在の入力を別の証拠として記録し、正式な後続契約へ渡せます。過去の作者、停止時点の状態、未知の利用量は推定しません。
    役割間の受入れと認可の追記を、担当への指示発行の直前に共通化します。通常のレビュー、修正、再レビュー、持込み入力のレビューでは、保存済みの契約と元の認可、明示した設定対象を照合し、必要な同一契約の役割認可だけを追記します。元の仕事の承認だけで、別の設定や権限を許可しません。
    計画・調査の採用も副作用のない型付き判定へ接続します。観測なし、回答不足、不正な引用、記録の失効、目的不一致を区別し、非実行の助言を修正指示へ転用しません。助言の採用、品質合格、実行許可、公開許可は別の判断です。
    `workflow observe-input` と `workflow assess-input` は引き続き現在の入力と目的別の受入れを扱います。元の認可・結果・停止履歴・未知の利用量は変更せず、限定した役割委譲、期限、課金、対象、独立レビューの検査を維持します。追加の有料判定や汎用工程エンジンは導入しません。設計判断と操作は `ADR-0066` と関連ガイドを参照してください。
    保存済み結果の受理、未開始レビューの復旧、停止前の費用・期限変更は、それぞれ正式な操作と適用条件で扱います。回答受信中の台帳監視の反復負荷も抑えます。人が実施した検証を記録するモデル不要の作業は、独立検証済みの品質合格とは区別します。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.21` を明示選択します。稼働中の実行ファイルは差し替えません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.21 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    独立レビューの成功と品質ゲートの合格は別です。承認済みの旧契約に必須の文書整合条件がなければ、レビューが成功しても `workflow evaluate --require-quality` と公開ゲートは未達を返します。旧承認を遡及変更せず、完了済みの結果へ条件を付け足す正式操作もありません。品質ゲートの合格が必要なら、必要な条件を含む新契約と同一対象の独立レビューを別途承認します。既存の成果・検証証拠は適用条件を照合して再利用し、実装担当の再実行を既定にしません。
    停止済みの処理や任意の欠落認可を自動修復する機能ではありません。設定対象に含まれない担当、契約の変更、不明な実行を、新しい認可や再送で迂回しません。任意の役割委譲を選んだ場合は、その限定を維持します。
    任意形式・全役割の自動解釈、過去の作者・停止時点の同一性・未記録の検証や利用量の推定は行いません。新しい記録を保存した作業領域は対応版で扱い、旧版で更新しないでください。観測や入力の受入れだけでモデル実行、期限・費用の延長、公開を許可しません。外部側の成功報告は確認した代表ケースに限り、以前の失敗や品質ゲート未達を成功へ書き換えません。
changelog:
  disable: true
