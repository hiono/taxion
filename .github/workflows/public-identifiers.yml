name: public-identifiers

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  release:
    types: [published, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-identifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never execute PR code with the protected-name policy or API token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
      - name: Check event text and commit messages without logging their content
        env:
          GH_TOKEN: ${{ github.token }}
          TAXION_PUBLIC_PRIVATE_IDENTIFIER_SHA256: ${{ secrets.PUBLIC_TEXT_PRIVATE_IDENTIFIER_SHA256 }}
        run: go run ./scripts/publictext -github-identifiers
