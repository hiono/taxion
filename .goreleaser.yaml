version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    `workflow recover-review --file JSON --preview` を追加し、停止した検証済み成果物の最初のレビュー指示について、取消、同一候補の後続契約、レビュー専用の工程計画を一括提示します。一つの外側ハッシュへの承認から内部の各ハッシュを導出し、操作ごとの承認質問を不要にします。
    適用は既存の検査と監査を再利用し、一つのデータベース取引で保存します。不一致や検査失敗で取消だけが残る部分適用は行いません。実行停止の確認証拠、配送不明の受容、元候補と準備済みの場所の照合、予算上限、絶対期限を維持します。既存の承認を根拠なく新しい承認へ読み替えません。
    適用自体はモデルを起動せず、実装担当と入力検証の再実行も追加しません。一括承認内の起動前検査とレビューは再承認を求めず進め、結果受理検証を維持します。既に承認済みの工程をこの復旧操作へ戻しません。操作と制約は CLI リファレンスと `ADR-0058` に記録しています。
    実行後に正式停止して指示が `CANCELLED` になった成果物レビューも、`continueStoppedExecution:true` で同じ操作から引き継げます。実行停止記録と候補・作業場所を照合し、元期限を超えず、合格した入力検証記録と保存済み解析の抜粋を後続レビューへ渡します。旧セッション・消費・停止履歴は保持し、未開始向け整合回復の条件は緩和しません。
    `conversation intake` の `reviewInput` は、人が作ったコード・文書・テストや失敗途中の成果について、レビュー目的・質問・既知の失敗・検証状況・読める証拠を固定します。同じ出典の成果物を実装担当なしでレビューし、診断の完了を製品品質の合格と区別します。診断だけで製品公開の品質検査を通過させません。
    `workflow budget --id FLOW_ID --file ESTIMATE.json` は、明示した単位・範囲の累計消費と、残工程・修正・独立レビュー・保存の見込みから不足分を算出します。上限到達前にまとめて確認し、成果・根拠・承認から再開する方針を案内と管理スキルにも反映します。先行工程の予算観測を併記し、新しい工程を累計消費のリセットと扱いません。
    
    ## Upgrade
    
    `mise` で `github:hiono/taxion@0.7.21-rc.11` を明示選択します。安定版の自動更新先にはしません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。全実行の停止を確認し、旧設定とデータベースを保全したうえで、新しい配布物の固定値を再承認し、旧設定の退避・再登録・`provenance verify` を行います。管理スキルは 1.3.17 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    未開始向け一括復旧は実行記録のない最初の検証済み成果物レビュー指示に限定します。実行後の継続は正式停止記録がある場合の別条件で、終端セッションの再開や未保存の思考の復元ではありません。任意の作業への包括委任ではなく、対象・設定・権限や期限・予算の拡張は別の人間の判断です。内部記録の時刻などによる下位ハッシュの変化だけを追加承認の理由にはしません。既存の場所を手で修復して条件を通過させないでください。
    見積り補助は自動の残量照会・追加承認・通貨換算・累計上限登録ではなく、完了保証もありません。外側で実際の承認上限を記録し、既存の実行検査を維持します。診断入力の証拠は承認済みの場所から準備し、任意の管理ログ収集、修正、自動再試行は行いません。未保存のモデル思考を復元する機能ではありません。
    期限切れの工程は再開せず、期限・予算を延長しません。新しい契約・工程計画とモデル実行には有効な承認が必要です。製品環境での適用確認は未実施であり、配布自体は製品の品質合格を意味しません。OpenCode の無料枠／Go の実契約別受入れは Issue #234／#231 で継続します。
    検証コマンドは承認済みの権限で任意のコードを実行できます。新たな有料実行、公開、権限・期限・予算の拡張をこの更新から推定しません。
changelog:
  disable: true
