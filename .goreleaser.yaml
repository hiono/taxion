version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Changed
    
    実装役のシェルは、割り当てられた作業ツリーの中でのビルド、テスト、差分の確認に限り実行できるようになりました。
    この許可は、実装役のツール一覧に `bash` または `powershell` を含めた場合だけ有効です。
    ネットワークを使うコマンド、`gh`、Git の更新、入れ子のシェル、`.git` と作業ツリー外のパスは引き続き拒否します。
    レビュー役のシェルは引き続き拒否します。
    `taxion workflow repair-status --id FLOW` を追加しました。保存済みのフローを読み取り専用で調べ、次の修正を人間に確認せずに進めてよいかを返します。
    停止済みのフローを実行しようとした場合は、標準エラーにこの分類と確認用のコマンドを表示します。標準出力の内容は変わりません。
    
    ## Compatibility
    
    実装役のツール一覧にシェルを含めない既定の構成では、シェルは従来どおり拒否されます。
    停止済みのフローは従来どおり終端状態で、自動では再開しません。
    
    ## Upgrade
    
    mise の GitHub 対応機能で版を固定し、配布情報とファイルのハッシュ、公開処理の成功を照合してください。
    
    ## Rollback
    
    戻し先の `v0.7.13` は、6環境すべてに対応する正式配布ファイルを使用します。
    `v0.7.13` へ戻すと、実装役のシェルはすべて拒否され、`workflow repair-status` は使えなくなります。
    
    ## Known limitations
    
    シェルの検査は、解析したコマンドに対する拒否リストであり、隔離環境ではありません。
    `make`、スクリプトの実行系、`find -exec` などが内部で起動するプロセスは検査しません。ネットワークや作業ツリー外への書込みを確実に止めるには、実行環境の隔離が別に必要です。
    `workflow repair-status` は、Git の証拠、記憶、承認済みの指示案を検証しません。これらは `workflow advance` が続行時に検証します。
changelog:
  disable: true
