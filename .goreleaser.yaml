version: 2
project_name: taxion
builds:
  - id: taxion
    main: ./cmd/taxion
    binary: taxion
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.releaseVersion=v{{ .Version }}
      - -X main.releaseRevision={{ .FullCommit }}
      - -X main.releaseBuiltAt={{ .Date }}
      - -X main.releaseChannel={{ if .IsSnapshot }}development{{ else }}github-release{{ end }}
snapshot:
  version_template: '{{ .Env.TAXION_VERSION }}-snapshot'
archives:
  - id: binary
    ids: [taxion]
    name_template: 'taxion_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: .release/release-info.json
        strip_parent: true
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
checksum:
  name_template: SHA256SUMS
source:
  enabled: false
release:
  draft: true
  prerelease: auto
  mode: keep-existing
  # This describes included changes, not the outcome of later publication checks.
  header: |
    ## Fixed
    
    停止後の復旧だけでなく、停止前に時間と費用の不足をまとめて判断できるようにします。モデル応答待ちと利用量受信時の `resource_approval_required` は、残工程・検証・修正・保存・回答待ちを見込んだ追加承認を操作者へ要求します。判断待ちを理由に、有効な実行を先回りして取り消しません。
    `workflow budget --file` は、明示した単位・範囲の累計費用と残時間を一つの報告へまとめます。`workflow extend --file JSON --preview` で現在の指示・実行と変更前後の期限・固有の利用額上限を固定し、一度の正確な承認後に適用します。元記録・累計消費・工程計画を保持したまま、同じ指示・実行プロセス・セッションが旧期限の後も実行を続けます。追加のモデル起動、入力検証の繰返し、下位ハッシュごとの承認は行いません。
    稼働中の延長は現在の工程期限前に限ります。すでに正式停止した成果物レビューには、同じ `workflow recover-review` の `continueStoppedExecution:true` と、必要なら `deadlineRecontract` を使います。同じ候補・合格入力検証・保存解析を引き継ぎ、実装担当と入力検証を繰り返さず、結果受理検証は維持します。
    時間だけの追加承認も扱い、費用上限は据え置きます。承認の記録だけを適用済みとは扱わず、適用監査と新しい有効期限を確認します。`request` も停止前の判断要求を表示します。
    実行プロセス終了後に提供元のセッションへ完成回答が保存されている場合は、`workflow recover` の `finalizeSavedResult:true` で同じ回答を正式受理します。元期限内の回答・応答ターン完了と保存済み実行観測を照合し、短い `validationDeadline` でホスト検証だけを行います。実行中の回答受信と同じ結果確定処理を使い、検証済み・実行基盤終了済みの記録、管理作業場所の解放、正式結果保存を経て実行プロセスの所有権を回収します。保存済みの検証やモデル指示は繰り返さず、消費と修正回数を維持します。
    管理スキル、`ADR-0058`、CLI と監査仕様を実装と同じ変更へ揃えます。`README` と参加ガイドは利用目的から案内し、現行コードに基づくアーキテクチャを設計の正本にします。利用者・開発者文書の古い版別操作、誤った保存構造、期限や戻し方の矛盾を整理し、現在の仕様と設計・検証履歴を分けます。
    
    ## Upgrade
    
    実行を停止・保全した状態で、`mise` の `github:hiono/taxion@0.7.21-rc.13` を明示選択します。稼働中の実行ファイルは差し替えず、安定版の自動更新先にも変更しません。整合したデータベース、設定、旧実行と成果物を保全し、配布情報・ハッシュ・公開処理全体の成功を照合してください。
    同じ作業台帳の旧 `operation-policy.json` は自動上書きしません。承認した新配布物の固定値へ正式に更新し、`provenance verify` を行います。管理スキルは 1.3.19 です。更新が許可されている場合に旧ファイルを保全し、`ready --update-skill`、`ready --check-skill`、`ready` を実行します。
    
    ## Rollback
    
    戻し先は公開済み安定版の `v0.7.20` です。新しい指示・結果・検証記録を保存したデータベースを旧版で操作しないでください。現状を保護し、適用前の整合したバックアップを別配置で使います。成果・停止履歴・保留・承認を削除して戻す操作は行いません。
    
    ## Known limitations
    
    判断要求は自動承認や完了時間の保証ではありません。外側のリクエスト数・トークン数・クレジット数と固有の利用額単位は換算せず、追加枠は同じ判断で必要な人間の承認を得ます。提供元停止、アカウント残量下限、独立した呼出し元の期限・取消、役割や修正回数、公開権限は上書きしません。
    期限切れや終端セッションでモデル作業を再開するときは、稼働中の延長ではなく正式な後続を作ります。完成済み回答の受理はモデル作業の再開とは区別します。検証開始だけが保存され、検証済み結果がないホストコマンドは、結果不明として自動再実行を拒否します。未保存の思考は復元せず、旧版で新監査を操作しません。製品環境への導入・復旧成功は配布検証と別の受入れです。
changelog:
  disable: true
